[project]
name = "agri_control"
authors = [{ name = "NutrigreenBite", email = "admin@nutrigreenbite.com" }]
description = "Relay control, schedules and live MQTT monitoring for the NutrigreenBite farm"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "paho-mqtt>=2.0,<3",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=14.0.0,<17.0.0"
