# Agri Control MQTT listener - keeps exactly one subscriber running for the site.
# Install:
#   sudo cp deploy/supervisor-agri-mqtt.conf /etc/supervisor/conf.d/agri-mqtt.conf
#   (edit the paths / user / site below if your bench is elsewhere)
#   sudo supervisorctl reread && sudo supervisorctl update
#   sudo supervisorctl status agri-mqtt
#
# This calls Frappe's CLI directly with the bench's own Python, the same way
# `bench --site <site> agri-mqtt` does, so it does not depend on the bench CLI being on PATH.

[program:agri-mqtt]
command=/home/frappe/frappe-bench/env/bin/python -m frappe.utils.bench_helper frappe --site erp.nutrigreenbite.com agri-mqtt
directory=/home/frappe/frappe-bench/sites
user=frappe
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/home/frappe/frappe-bench/logs/agri-mqtt.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
